services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-widget_platform}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - widget_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-widget_platform}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: sh -c "npm run migrate && npm start"
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@db:5432/${POSTGRES_DB:-widget_platform}
      JWT_SECRET: ${JWT_SECRET:-replace-with-local-development-secret}
      GEO_PROVIDER_A_MODE: ${GEO_PROVIDER_A_MODE:-real}
      GEO_PROVIDER_B_MODE: ${GEO_PROVIDER_B_MODE:-real}
      SIDE_EFFECT_MODE: ${SIDE_EFFECT_MODE:-success}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-1000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-5}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      PUBLIC_DEMO_ORIGIN: ${PUBLIC_DEMO_ORIGIN:-http://localhost:5500}
      BODY_LIMIT: ${BODY_LIMIT:-16kb}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-3000}:3000"

  worker:
    build: .
    command: sh -c "npm run migrate && npm run worker"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@db:5432/${POSTGRES_DB:-widget_platform}
      JWT_SECRET: ${JWT_SECRET:-replace-with-local-development-secret}
      GEO_PROVIDER_A_MODE: ${GEO_PROVIDER_A_MODE:-real}
      GEO_PROVIDER_B_MODE: ${GEO_PROVIDER_B_MODE:-real}
      SIDE_EFFECT_MODE: ${SIDE_EFFECT_MODE:-success}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-1000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-5}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      BODY_LIMIT: ${BODY_LIMIT:-16kb}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
    depends_on:
      db:
        condition: service_healthy

  demo-site:
    image: nginx:1.27-alpine
    volumes:
      - ./demo-site:/usr/share/nginx/html:ro
    ports:
      - "${DEMO_HOST_PORT:-5500}:80"
    depends_on:
      - api

volumes:
  widget_platform_pgdata:
